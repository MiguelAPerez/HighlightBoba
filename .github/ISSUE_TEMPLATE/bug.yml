name: Highlighting bug
description: Something is coloured wrong, or the highlighter is slow or crashes
labels: [bug]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: swift
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Smallest input that shows it
      description: Paste the code. It is rendered as a code block.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what you got
      description: Which token has the wrong scope, or where the colouring goes wrong.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HighlightBoba version
      placeholder: 0.1.0
