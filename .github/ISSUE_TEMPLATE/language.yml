name: Language request
description: Ask for a grammar for a new language
labels: [language]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: input
    id: extensions
    attributes:
      label: File extensions or file names
      placeholder: .toml, Cargo.lock
  - type: textarea
    id: sample
    attributes:
      label: A representative sample
      description: Ideally including the tricky parts (nested strings, heredocs, embedded languages).
      render: text
  - type: input
    id: spec
    attributes:
      label: Link to the language's specification or grammar reference
