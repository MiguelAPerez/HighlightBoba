name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit email and domain allowlist
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-commit-emails.sh "origin/${{ github.base_ref }}..HEAD^2"
          else
            scripts/check-commit-emails.sh HEAD
          fi

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Signed-off-by on every commit
        run: scripts/check-dco.sh "origin/${{ github.base_ref }}..HEAD^2"

  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
      # A busy runner may give the cooperative pool very few threads. Run the tests that hold a
      # pool thread with exactly one, so a wait that needs another fails every run, not one in ten.
      - name: swift test, one-thread cooperative pool
        run: swift test --skip-build --filter "ParseSessionTests|CancellationTests|StackTests"
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
      - name: Upload fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-report
          path: .build/fixture-report/
          if-no-files-found: warn
